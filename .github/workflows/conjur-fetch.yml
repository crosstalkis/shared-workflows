name: Conjur fetch (reusable)

# Reusable workflow. Callers in the crosstalkis org invoke this via:
#
#   jobs:
#     release:
#       uses: crosstalkis/shared-workflows/.github/workflows/conjur-fetch.yml@v1
#       permissions:
#         id-token: write
#         contents: read
#       with:
#         app-name: alpha
#
# Phase-4 identity model (R1 — per-repo entitlement):
#
#   - The JWT's `repository` claim (set by GitHub at mint time, NOT
#     influenced by anything in this workflow) is what Conjur uses for
#     host lookup. Conjur config:
#       token-app-property = repository
#       identity-path      = repos
#     Host id resolved at authn time: host/repos/crosstalkis/<repo>.
#   - `app-name` is still an input, but it ONLY drives the secret-path
#     default (apps/<app-name>/secrets/db-password). It is no longer
#     the identity carrier. Calling with app-name: beta from a repo
#     that is not a member of the apps/beta layer in Conjur will FAIL
#     at the secret fetch step (403), not at authn (which succeeds for
#     the repo's own host).
#   - Authorization: per-repo hosts are granted into app-layer
#     membership in Conjur policy 25-grants.yml. Layer permits on
#     apps/<name>/secrets/db-password cascade to layer members.
#   - Defense in depth (kept): host annotations pin job_workflow_ref
#     to the trusted reusable @v1 (tag mutability remains a separate
#     gap — R3 in the queue, so @v1 is the trust pin, not yet an
#     immutable trust anchor) and repository_owner to crosstalkis.
#     Phase 4 adds repository + repository_id pins on top. A forged
#     JWT with the wrong repo claim fails annotation match. A
#     rename-to-impersonate breaks at the repository_id pin.
#
# Phase-3 history: this workflow USED to set
# `environment: ${{ inputs.app-name }}` on the fetch job, and Conjur
# USED `environment` as the lookup key. That made the identity
# caller-controlled (app-alpha could pass app-name: beta and authenticate
# as apps/beta). R1 closes that gap.

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
        description: >
          Logical application identity (alpha/beta/gamma/rogue). Drives
          the default secret path only. NOT the authn identity carrier
          since Phase 4.
      conjur-url:
        type: string
        required: false
        default: 'https://conjur-oss.conjur.svc.cluster.local'
      conjur-account:
        type: string
        required: false
        default: 'lab'
      conjur-service-id:
        type: string
        required: false
        default: 'gha'
      conjur-audience:
        type: string
        required: false
        default: 'conjur/lab'
      secret-id:
        type: string
        required: false
        description: >
          Override the secret path. Default derives from app-name:
          apps/<app-name>/secrets/db-password. Callers asking for
          another app's secret will get 403 — see Phase 4 T2 in
          conjur-2026-05-16.md.
        default: ''

jobs:
  fetch:
    runs-on: lab-runners
    # NOTE: no `environment:` here. Phase 4 removed it. Identity is
    # carried by the `repository` claim now, which GitHub sets at
    # JWT-mint time without any input from this workflow.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Run context
        run: |
          echo "App input (drives secret path only): ${{ inputs.app-name }}"
          echo "Caller repo (Conjur identity):       ${{ github.repository }}"
          echo "Caller ref:                          ${{ github.ref }}"
          echo "Conjur URL:                          ${{ inputs.conjur-url }}"
          echo "Secret id:                           ${{ inputs.secret-id }}"

      - name: Resolve secret-id
        id: resolve
        run: |
          if [[ -n "${{ inputs.secret-id }}" ]]; then
            echo "secret-id=${{ inputs.secret-id }}" >> "$GITHUB_OUTPUT"
          else
            echo "secret-id=apps/${{ inputs.app-name }}/secrets/db-password" >> "$GITHUB_OUTPUT"
          fi

      - name: Conjur JWT exchange + secret fetch
        id: conjur
        uses: crosstalkis/shared-workflows/.github/actions/conjur-jwt-fetch@v1
        with:
          app-name: ${{ inputs.app-name }}
          conjur-url: ${{ inputs.conjur-url }}
          conjur-account: ${{ inputs.conjur-account }}
          conjur-service-id: ${{ inputs.conjur-service-id }}
          conjur-audience: ${{ inputs.conjur-audience }}
          secret-id: ${{ steps.resolve.outputs.secret-id }}

      - name: Use the secret (never echoed)
        env:
          SECRET: ${{ steps.conjur.outputs.secret-value }}
        run: |
          if [[ -z "${SECRET}" ]]; then
            echo "ERROR: empty secret-value output from composite action" >&2
            exit 1
          fi
          echo "Secret retrieved successfully. Length=${#SECRET}"
