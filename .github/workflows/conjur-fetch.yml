name: Conjur fetch (reusable)

# Reusable workflow. Callers in the crosstalkis org invoke this via:
#
#   jobs:
#     release:
#       uses: crosstalkis/shared-workflows/.github/workflows/conjur-fetch.yml@v1
#       permissions:
#         id-token: write
#         contents: read
#       with:
#         app-name: alpha
#
# Phase-3 identity model (post org-level OIDC sub customization):
#
#   - sub          = job_workflow_ref:crosstalkis/shared-workflows/...@refs/tags/v1
#                    (same for every caller — the org-wide template drops the
#                    repo identifier from sub)
#   - environment  = <app-name> (alpha/beta/gamma/rogue) — set on this job,
#                    bubbles into the JWT as the `environment` claim
#   - repository   = <caller repo> (still per-caller, used for evidence trail)
#
# Conjur uses the `environment` claim as the per-app handle (token-app-property)
# and validates `job_workflow_ref` matches the trusted reusable as defense-
# in-depth annotation. Three repos with app-name=beta all authenticate as
# the same Conjur host apps/beta even though their repository claims differ.

on:
  workflow_call:
    inputs:
      app-name:
        type: string
        required: true
        description: 'Logical application identity (alpha/beta/gamma/rogue).'
      conjur-url:
        type: string
        required: false
        default: 'https://conjur-oss.conjur.svc.cluster.local'
      conjur-account:
        type: string
        required: false
        default: 'lab'
      conjur-service-id:
        type: string
        required: false
        default: 'gha'
      conjur-audience:
        type: string
        required: false
        default: 'conjur/lab'
      secret-id:
        type: string
        required: false
        description: >
          Override the secret path. Default derives from app-name:
          apps/<app-name>/secrets/db-password. Callers that need a different
          secret can pass this explicitly.
        default: ''

jobs:
  fetch:
    # Matches the gha-runner-scale-set name installed in arc-runners ns.
    runs-on: lab-runners

    # Environment derived from app-name. This is the Phase 3 lever — the
    # GHA OIDC token's `environment` claim becomes the per-app workload
    # identity that Conjur uses for host lookup (token-app-property=environment,
    # identity-path=apps). Three caller repos sharing app-name=beta all
    # authenticate as the same Conjur host (apps/beta) even though their
    # `repository` claims differ.
    environment: ${{ inputs.app-name }}

    permissions:
      id-token: write    # required so the runner exposes ACTIONS_ID_TOKEN_REQUEST_*
      contents: read
    steps:
      - name: Run context
        run: |
          echo "App identity (logical, from caller): ${{ inputs.app-name }}"
          echo "Caller repo (OIDC sub will reflect this): ${{ github.repository }}"
          echo "Caller ref:  ${{ github.ref }}"
          echo "Conjur URL:  ${{ inputs.conjur-url }}"
          echo "Secret id:   ${{ inputs.secret-id }}"

      - name: Resolve secret-id
        id: resolve
        run: |
          # Caller override wins; otherwise derive apps/<app-name>/secrets/db-password.
          if [[ -n "${{ inputs.secret-id }}" ]]; then
            echo "secret-id=${{ inputs.secret-id }}" >> "$GITHUB_OUTPUT"
          else
            echo "secret-id=apps/${{ inputs.app-name }}/secrets/db-password" >> "$GITHUB_OUTPUT"
          fi

      - name: Conjur JWT exchange + secret fetch
        id: conjur
        # Pinned by tag — same as the reusable workflow ref. v1 moves only on
        # intentional release. Bumping shared-workflows version is a deliberate
        # rollout decision (matches how this'd work in ČSAS).
        uses: crosstalkis/shared-workflows/.github/actions/conjur-jwt-fetch@v1
        with:
          app-name: ${{ inputs.app-name }}
          conjur-url: ${{ inputs.conjur-url }}
          conjur-account: ${{ inputs.conjur-account }}
          conjur-service-id: ${{ inputs.conjur-service-id }}
          conjur-audience: ${{ inputs.conjur-audience }}
          secret-id: ${{ steps.resolve.outputs.secret-id }}

      - name: Use the secret (never echoed)
        env:
          SECRET: ${{ steps.conjur.outputs.secret-value }}
        run: |
          # Echoing $SECRET would be redacted by the mask anyway, but don't
          # bait the mask filter. Just show that we got something.
          if [[ -z "${SECRET}" ]]; then
            echo "ERROR: empty secret-value output from composite action" >&2
            exit 1
          fi
          echo "Secret retrieved successfully. Length=${#SECRET}"
