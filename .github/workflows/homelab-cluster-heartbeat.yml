name: Homelab cluster heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-cluster-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: lab-runners
    timeout-minutes: 2
    steps:
      - name: Confirm the Kubernetes runner is alive
        shell: sh
        run: |
          set -eu
          printf 'Kubernetes ARC heartbeat at %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
