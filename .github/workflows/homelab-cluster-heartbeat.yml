name: Homelab cluster heartbeat

# External cluster watchdog.
#
# History: this job used to run on the in-cluster ARC self-hosted runner pool
# (`runs-on: lab-runners`), which existed to serve the Conjur secrets lab. ARC was
# retired on 2026-09-21 along with the lab, so this now runs on a GitHub-hosted
# runner and proves the same thing a different way: an outside observer can reach
# an in-cluster service through Cloudflare Tunnel and Traefik.
#
# Target choice: notes.crosstalkis.com serves Quartz from the `knowledge`
# namespace. The Authelia forward-auth redirect (302) is issued before CrowdSec
# evaluates the client, so this endpoint answers consistently from a datacenter IP.
# phonebook.crosstalkis.com was tried first and returned 403 from GitHub runner
# range because CrowdSec blocks it - a working control, but useless as a probe.
#
# This is a liveness signal, not a correctness check. A failure means the cluster
# is unreachable from the internet, or Cloudflare/Traefik/Authelia is degraded.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-cluster-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe the public homelab endpoint
        shell: bash
        run: |
          set -euo pipefail
          target="https://notes.crosstalkis.com/"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 "$target")
          printf 'Homelab cluster heartbeat at %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'Target: %s -> HTTP %s\n' "$target" "$code"
          # 200 = page served, 302 = Authelia forward-auth redirect. Both prove the
          # request traversed Cloudflare into the cluster and reached a real backend.
          case "$code" in
            200|302) exit 0 ;;
            *)
              echo "::error::Homelab endpoint returned HTTP $code, expected 200 or 302"
              exit 1
              ;;
          esac
