name: Homelab cluster heartbeat

# External cluster watchdog.
#
# History: this job used to run on the in-cluster ARC self-hosted runner pool
# (`runs-on: lab-runners`), which existed only to serve the Conjur secrets lab.
# ARC was retired on 2026-09-21 with that lab, so this now runs on a GitHub-hosted
# runner and proves the same thing a different way: an outside observer can reach
# a public homelab service through Cloudflare Tunnel and Traefik into the cluster.
#
# Target: phonebook.crosstalkis.com. It is the right choice because it is the only
# candidate that is both (a) published in public DNS and (b) served from the
# cluster. notes.crosstalkis.com was tried first and failed with a DNS error -- it
# is LAN/Tailscale only and intentionally has no public record. See the
# "Lab Service Exposure Register" for the exposure model.
#
# Status handling: this asserts REACHABILITY, not response content. CrowdSec at
# the Traefik edge blocks datacenter IP ranges, so GitHub runners legitimately get
# 403. That is a working control, not an outage. Any HTTP status proves the request
# reached the cluster, so the check passes on any response and fails only on
# transport failure (DNS, TLS, timeout, connection refused).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-cluster-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe the public homelab endpoint
        shell: bash
        run: |
          set -euo pipefail
          target="https://phonebook.crosstalkis.com/"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if ! code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 "$target"); then
            echo "::error::Homelab unreachable at ${ts}: transport failure contacting ${target}"
            exit 1
          fi
          printf 'Homelab cluster heartbeat at %s\n' "$ts"
          printf 'Target: %s -> HTTP %s (any response proves the cluster answered)\n' "$target" "$code"
          if [ "$code" = "000" ]; then
            echo "::error::Homelab unreachable at ${ts}: no HTTP response from ${target}"
            exit 1
          fi
